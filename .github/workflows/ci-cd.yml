name: CI/CD Pipeline

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main]
        
jobs:
    ci:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                node-version: '18'

            - name: Install dependencies
              run: npm install

            - name: Run linter
              run: npm run lint

            - name: Run unit tests
              run: npm test

            - name: Build project
              run: npm run build
    cd:
        runs-on: ubuntu-latest
        needs: ci # Ждёт успешного завершения CI
        if: github.ref == 'refs/heads/main' # Только для основной ветки
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              
            - name: Deploy to Vercel/Netlify/Render
            # Здесь команды деплоя выбранной платформы
              run: npm run deploy
              env:
                DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
